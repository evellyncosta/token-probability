<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Token Probability Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LLM Token Probability Visualizer</h1>
            <p>Veja como uma palavra e construida token por token</p>
        </div>
        
        <div class="chat-container">
            <div class="message user-message">
                <div class="message-content">
                    <span class="prompt-text">o gato subiu no </span>
                </div>
            </div>
            
            <div class="message assistant-message">
                <div class="message-content">
                    <div id="response-text" class="response-text">
                        <!-- Response will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <section id="token-analysis" class="token-analysis" aria-live="polite">
            <h2>Proximo token</h2>
            <p class="token-context">Contexto antes da escolha: <code id="token-context"></code></p>
            <table class="probability-table">
                <thead>
                    <tr><th>Token</th><th>Probabilidade</th></tr>
                </thead>
                <tbody id="probability-table-body"></tbody>
            </table>
            <p class="probability-note">A tabela mostra somente os tokens mais provaveis; outros tokens tambem podem ter probabilidade.</p>
        </section>
        
        <div class="input-section">
            <div class="input-container">
                <textarea id="prompt-input" placeholder="Enter your prompt here..." rows="3"></textarea>
                <button id="generate-btn" onclick="generateResponse()">Generate</button>
            </div>
        </div>
        
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
