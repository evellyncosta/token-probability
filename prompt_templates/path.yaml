max_tokens: 1

template: |-
  {locale_instruction}

  Continue the user's text naturally with exactly one next token.

  Rules:
  - Return only the next token.
  - Do not repeat any part of the user's text.
  - Do not explain your answer.
  - Do not add labels, quotation marks, Markdown, or commentary.
  - Preserve the token exactly as generated.
  - If the next token begins with a leading space, that space is part of the token and must be included.
  - Do not remove, trim, normalize, or omit leading whitespace.
  - If the next token is punctuation, return only that punctuation without adding a space.